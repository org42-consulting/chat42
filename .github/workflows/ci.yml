name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Swift 6.0 or newer is required, for two independent reasons:
#   - mlx-swift-examples pulls in swift-jinja 2.x, whose Package.swift declares
#     swift-tools-version 6.0. An older toolchain cannot resolve the graph at all.
#   - `swift format` is only bundled with the toolchain from Swift 6.0.
# macos-15 runners are Apple Silicon and ship Xcode 16.x, which satisfies both.
# The runner default is used rather than a pinned Xcode path, because pinning a
# specific version is what broke this workflow the first time it ran.

jobs:
  test:
    name: Build and test
    # Apple Silicon: MLX only compiles its inference path under arch(arm64), so an
    # Intel runner would build a different app than the one that ships.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Require Swift 6.0+
        run: |
          version="$(swift --version 2>&1 | sed -nE 's/.*Apple Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p' | head -1)"
          major="${version% *}"
          if [ -z "${major}" ] || [ "${major}" -lt 6 ]; then
            echo "::error::Swift 6.0+ required (swift-jinja needs tools-version 6.0; swift format ships with 6.0). Found: $(swift --version 2>&1 | head -1)"
            exit 1
          fi

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build -c debug

      - name: Test
        run: swift test

  lint:
    name: Format and localization checks
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Check Swift formatting
        run: |
          swift format lint --recursive --strict Chat42/Sources Tests \
            || { echo "::error::Run 'swift format --in-place --recursive Chat42/Sources Tests'"; exit 1; }

      - name: Check en/nl key parity
        # The two .strings files are kept with identical key sets; a key added to
        # one and not the other ships an untranslated string to Dutch users.
        run: ./scripts/check-localization.sh

  package:
    name: Assemble app bundle
    runs-on: macos-15
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Signs ad-hoc when no Developer ID is present, which is what CI wants:
      # it proves the bundle assembles. package.sh refuses to notarize an ad-hoc
      # bundle rather than producing a DMG that Gatekeeper would reject.
      - name: Build app bundle
        run: ./build.sh

      - name: Verify bundle layout
        run: |
          test -x build/Chat42.app/Contents/MacOS/Chat42
          test -f build/Chat42.app/Contents/Info.plist
          test -f build/Chat42.app/Contents/Resources/PrivacyInfo.xcprivacy
          test -f build/Chat42.app/Contents/Resources/en.lproj/Localizable.strings
          test -f build/Chat42.app/Contents/Resources/nl.lproj/Localizable.strings
          codesign --verify --deep --strict --verbose=2 build/Chat42.app
